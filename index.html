<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Notes</title>
<link rel="apple-touch-icon" href="Notes.png">
<style>
  * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
  }
:root {
  --accent:#3a8fd0;
  --bg:#f5f7fa;
  --bg2:#e9eef5;
  --text:#222;
  --border:#c8d3e0;
  --linenum-bg:#e1e6ed;
  --linenum-color:#8892a0;
}

body{margin:0;font-family:-apple-system;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
header{background:var(--bg2);padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);height:50px;box-sizing:border-box}
header h1{margin:0;font-size:20px;flex-grow:1}

.theme-toggle-group{display:flex;gap:10px;align-items:center;margin-left:auto;margin-right:5px}
.theme-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.theme-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

#toggleSidebar{font-size:18px;padding:6px 12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer}
#sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;background:var(--bg2);border-right:1px solid var(--border);padding:10px;z-index:999;display:flex;flex-direction:column;transform:translateX(-280px);transition:.25s ease-in-out;box-sizing:border-box}
#sidebar.open{transform:translateX(0)}
.sidebar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sidebar-header h2{margin:0;font-size:20px}
#closeSidebar{background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:16px;padding:4px 10px;border-radius:6px;cursor:pointer}
#sidebar-actions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;margin-bottom:10px;border-bottom:1px solid var(--border);justify-content:space-between}
.action-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:18px;padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:4px}
#treeList{list-style:none;padding:0;margin:0;overflow-y:auto;flex:1}
#treeList li{padding:4px 6px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;position:relative}
#treeList li.active{background:var(--accent)!important;color:#fff!important}
.arrow{width:18px;text-align:center;cursor:pointer;flex-shrink:0}
.tree-icon-png{width:20px;height:20px;object-fit:contain;vertical-align:middle;flex-shrink:0}
.item-title{flex-grow:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:25px}
.item-menu-icon{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:bold;color:#888;display:none;padding:2px 5px;border-radius:4px;z-index:10}
#treeList li:hover .item-menu-icon,#treeList li.active .item-menu-icon{display:block}
#treeList li .item-menu-icon:hover{background:rgba(0,0,0,0.1);color:var(--text)}
#contextMenu{position:absolute;background:var(--bg2);border:1px solid var(--border);border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:5000;display:none;min-width:120px}
#contextMenu button{display:block;width:100%;padding:8px 12px;text-align:left;background:none;border:none;color:var(--text);cursor:pointer;font-size:16px}
#contextMenu button:hover{background:var(--accent);color:#fff}
.delete-option{color:#d33!important}

#main{position:absolute;top:50px;left:0;right:0;bottom:0;transition:left .25s ease-in-out;display:flex;flex-direction:column}
#editor-header{padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center}

#node-title{flex:1; min-width:80px; padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:16px;}

#openEditBtn {
  padding: 6px 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

#toggleLinesBtn{padding:6px 10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px;flex-shrink:0;}
#toggleLinesBtn.active{background:var(--accent);color:#fff}

.editor-container{display:flex;flex:1;position:relative;overflow:hidden}
#lineNumbers{width:45px;background:var(--linenum-bg);color:var(--linenum-color);font-family:monospace;font-size:14px;padding:12px 4px;text-align:right;user-select:none;overflow:hidden;box-sizing:border-box;display:none;line-height:1.5}

/* ZONE LECTURE ET ÉDITION DIRECTE DU CONTENU */
#content{flex:1;background:var(--bg);color:var(--text);border:none;padding:24px;box-sizing:border-box;font-size:14px;font-family:sans-serif;line-height:1.5;overflow-y:auto;outline:none;cursor:text;}
#content[placeholder]:empty:before { content: attr(placeholder); color: #888; }
#content blockquote { border-left: 4px solid var(--accent); margin: 6px 0; padding-left: 10px; color: #777; font-style: italic; }

/* FENÊTRE MODALE D'ÉDITION EN PLEIN ÉCRAN */
#modalEdit {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 4000;
  display: none;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

#modalEditHeader {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.modal-edit-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.modal-edit-topbar h3 {
  margin: 0;
  font-size: 16px;
  color: var(--text);
}

#closeEditModalBtn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}

/* BARRE D'OUTILS DE LA FENÊTRE D'ÉDITION */
#toolbar{padding:4px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tb-group{display:flex;gap:4px;align-items:center}
#toolbar button, #toolbar select, .color-btn-label{padding:6px 8px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:14px;cursor:pointer;height:34px;box-sizing:border-box;display:flex;align-items:center;gap:4px}
#toolbar button:active{background:var(--accent);color:#fff}

#fontFamilySelect{padding:6px 4px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:13px;cursor:pointer;height:34px;box-sizing:border-box; max-width:120px; text-overflow:ellipsis;}

#toolbar button.active {
  background: var(--accent) !important;
  color: #ffffff !important;
  border-color: var(--accent) !important;
}

.select-size-compact {
  padding: 6px 2px 6px 6px !important;
  width: auto !important;
  min-width: 62px;
  font-weight: bold;
}

.color-picker-wrapper{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 6px;height:34px;box-sizing:border-box;font-size:13px}
.color-picker-wrapper input[type="color"]{width:26px;height:26px;border:none;background:none;cursor:pointer;padding:0}

#modalContent {
  flex: 1;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  box-sizing: border-box;
  font-size: 15px;
  font-family: sans-serif;
  line-height: 1.5;
  overflow-y: auto;
  outline: none;
}

#modal,#modalSub,#modalNote,#confirmDelete{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:3000}
.modalBox{background:var(--bg2);padding:20px;width:90%;max-width:320px;border-radius:10px;display:flex;flex-direction:column;gap:8px;max-height:90vh;overflow-y:auto}
.modalBox input,.modalBox select{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);box-sizing:border-box;font-size:16px;}
.modal-row{display:flex;gap:10px}
.modal-col{flex:1;display:flex;flex-direction:column;align-items:center;font-size:14px;cursor:pointer}
.modal-col input[type="checkbox"]{width:auto;margin-top:4px;cursor:pointer}
.modalButtons{display:flex;gap:10px;margin-top:10px}
.modal-btn{flex:1;padding:10px;border-radius:6px;border:none;font-size:16px;cursor:pointer}
.create-btn{background:var(--accent);color:#fff}.cancel-btn{background:#777;color:#fff}
.icon-yellow{color:#fbc02d}

.icon-picker-section { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.icon-scroll-list { max-height: 120px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px; background: var(--bg); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.icon-option { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 4px; cursor: pointer; font-size: 20px; background: var(--bg2); }
.icon-option:hover, .icon-option.selected { border-color: var(--accent); background: rgba(58,143,208,0.2); }
.icon-option img { width: 24px; height: 24px; object-fit: contain; }
</style>
</head>
<body>

<header>
  <button id="toggleSidebar">▶</button>
  <h1>Notes</h1>
  <div class="theme-toggle-group">
    <button class="theme-btn" id="lightThemeBtn" onclick="setTheme('light')" title="Mode Clair">☀️</button>
    <button class="theme-btn" id="darkThemeBtn" onclick="setTheme('dark')" title="Mode Sombre">🌙</button>
  </div>
</header>

<div id="sidebar">
  <div class="sidebar-header">
    <h2>Arbre</h2>
    <button id="closeSidebar" title="Fermer">⬅</button>
  </div>
  <div id="sidebar-actions">
    <button class="action-btn" id="addFolder" title="Nouveau Dossier">📁</button>
    <button class="action-btn" id="addSubFolder" title="Nouveau Sous-dossier">📂</button>
    <button class="action-btn" id="addNote" title="Nouvelle Note / Sous-note">📝</button>
    <button class="action-btn" id="exportBtn" title="Enregistrer l'arbre complet" style="font-size:14px; font-weight:bold;">💾 Enregistrer</button>
    <button class="action-btn" id="importBtn" title="Restaurer l'arbre" style="font-size:14px;">📂 Charger<input type="file" id="importFile" accept=".json" style="display:none"></button>
  </div>
  <ul id="treeList"></ul>
</div>

<div id="contextMenu">
    <button id="ctxOptions">Options</button>
    <button id="ctxDelete" class="delete-option">Supprimer</button>
</div>

<!-- MODAL DOSSIER -->
<div id="modal">
  <div class="modalBox">
    <h3>Option Dossier</h3>
    <input id="folderName" placeholder="Nom">
    <label>Police :</label>
    <select id="folderFont"><option value="-apple-system">Défaut</option><option value="Arial">Arial</option><option value="Courier New">Courier New</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option></select>
    <label>Taille :</label>
    <select id="folderSize"><option value="13px">13px</option><option value="14px" selected>14px</option><option value="16px">16px</option><option value="18px">18px</option></select>
    <div class="modal-row">
      <label class="modal-col">Gras<input type="checkbox" id="folderBold"></label>
      <label class="modal-col">Italique<input type="checkbox" id="folderItalic"></label>
      <label class="modal-col">Souligné<input type="checkbox" id="folderUnderline"></label>
    </div>
    <label>Fond :</label><input type="color" id="folderBgColor" value="#252526">
    <label>Texte :</label><input type="color" id="folderTextColor" value="#ffffff">
    
    <label>Icône :</label>
    <div class="icon-picker-section">
      <div class="icon-scroll-list" id="folderIconList"></div>
    </div>

    <div class="modalButtons"><button class="modal-btn cancel-btn" id="cancelModal">Annuler</button><button class="modal-btn create-btn" id="createFolder">OK</button></div>
  </div>
</div>

<!-- MODAL SOUS-DOSSIER -->
<div id="modalSub">
  <div class="modalBox">
    <h3>Option Sous-dossier</h3>
    <input id="subName" placeholder="Nom">
    <label>Police :</label>
    <select id="subFont"><option value="-apple-system">Défaut</option><option value="Arial">Arial</option><option value="Courier New">Courier New</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option></select>
    <label>Taille :</label>
    <select id="subSize"><option value="13px">13px</option><option value="14px" selected>14px</option><option value="16px">16px</option><option value="18px">18px</option></select>
    <div class="modal-row">
      <label class="modal-col">Gras<input type="checkbox" id="subBold"></label>
      <label class="modal-col">Italique<input type="checkbox" id="subItalic"></label>
      <label class="modal-col">Souligné<input type="checkbox" id="subUnderline"></label>
    </div>
    <label>Fond :</label><input type="color" id="subBgColor" value="#252526">
    <label>Texte :</label><input type="color" id="subTextColor" value="#ffffff">
    
    <label>Icône :</label>
    <div class="icon-picker-section">
      <div class="icon-scroll-list" id="subIconList"></div>
    </div>

    <div class="modalButtons"><button class="modal-btn cancel-btn" id="cancelModalSub">Annuler</button><button class="modal-btn create-btn" id="createSub">OK</button></div>
  </div>
</div>

<!-- MODAL NOTE -->
<div id="modalNote">
  <div class="modalBox">
    <h3>Option Note</h3>
    <input id="noteName" placeholder="Titre">
    <label>Police :</label>
    <select id="noteFont"><option value="-apple-system">Défaut</option><option value="Arial">Arial</option><option value="Courier New">Courier New</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option></select>
    <label>Taille :</label>
    <select id="noteSize"><option value="13px">13px</option><option value="14px" selected>14px</option><option value="16px">16px</option><option value="18px">18px</option></select>
    <div class="modal-row">
      <label class="modal-col">Gras<input type="checkbox" id="noteBold"></label>
      <label class="modal-col">Italique<input type="checkbox" id="noteItalic"></label>
      <label class="modal-col">Souligné<input type="checkbox" id="noteUnderline"></label>
    </div>
    <label>Fond :</label><input type="color" id="noteBgColor" value="#252526">
    <label>Texte :</label><input type="color" id="noteTextColor" value="#ffffff">
    
    <label>Icône :</label>
    <div class="icon-picker-section">
      <div class="icon-scroll-list" id="noteIconList"></div>
    </div>

    <div class="modalButtons"><button class="modal-btn cancel-btn" id="cancelModalNote">Annuler</button><button class="modal-btn create-btn" id="saveNoteOpt">OK</button></div>
  </div>
</div>

<div id="confirmDelete"><div class="modalBox"><h3>Supprimer ?</h3><p id="delName"></p><div class="modalButtons"><button class="modal-btn cancel-btn" id="delCancel">Annuler</button><button class="modal-btn create-btn" id="delOk" style="background:#d33">Supprimer</button></div></div></div>

<!-- FENÊTRE MODALE D'ÉDITION SÉPARÉE -->
<div id="modalEdit">
  <div id="modalEditHeader">
    <div class="modal-edit-topbar">
      <h3 id="editModalTitle">Rédaction de la note</h3>
      <button id="closeEditModalBtn" onclick="closeEditModal()">✔️ Fermer & Enregistrer</button>
    </div>
    
    <div id="toolbar">
      <div class="tb-group">
        <select id="fontFamilySelect" onchange="execCmd('fontName', this.value)" title="Changer la police de caractères">
          <option value="-apple-system" selected>Police</option>
          <option value="Apple Color Emoji">Apple Color Emoji</option>
          <option value="Arial">Arial</option>
          <option value="Arial Black">Arial Black</option>
          <option value="Arial Narrow">Arial Narrow</option>
          <option value="Cambria">Cambria</option>
          <option value="Comic Sans MS">Comic Sans</option>
          <option value="Consolas">Consolas</option>
          <option value="Courier New">Courier</option>
          <option value="Georgia">Georgia</option>
          <option value="Hiragino Mincho ProN">Hiragino Mincho</option>
          <option value="Impact">Impact</option>
          <option value="Lucida Console">Lucida</option>
          <option value="Monaco">Monaco</option>
          <option value="Noteworthy">Noteworthy</option>
          <option value="Segoe UI">Segoe UI</option>
          <option value="Snell Roundhand">Snell Roundhand</option>
          <option value="Tahoma">Tahoma</option>
          <option value="Times New Roman">Times</option>
          <option value="Trebuchet MS">Trebuchet</option>
          <option value="Verdana">Verdana</option>
        </select>
        
        <button id="btn-bold" onmousedown="event.preventDefault(); execCmd('bold');" title="Gras"><b>B</b></button>
        <button id="btn-italic" onmousedown="event.preventDefault(); execCmd('italic');" title="Italique"><i>I</i></button>
        <button id="btn-underline" onmousedown="event.preventDefault(); execCmd('underline');" title="Souligné"><u>U</u></button>
        <button id="btn-strike" onmousedown="event.preventDefault(); execCmd('strikeThrough');" title="Barré"><s>S</s></button>
      </div>

      <div class="tb-group">
        <button onmousedown="event.preventDefault(); execCmd('insertUnorderedList');" title="Liste à puces">• Liste</button>
        <button onmousedown="event.preventDefault(); execCmd('insertOrderedList');" title="Liste numérotée">1. Liste</button>
        <button onmousedown="event.preventDefault(); execCmd('formatBlock', 'blockquote');" title="Citation">💬</button>
        
        <select class="select-size-compact" onchange="changeTextSize(this.value);" title="Taille du texte">
          <option value="8pt">8pt</option>
          <option value="9pt">9pt</option>
          <option value="10pt">10pt</option>
          <option value="11pt">11pt</option>
          <option value="12pt" selected>12pt</option>
          <option value="14pt">14pt</option>
          <option value="16pt">16pt</option>
          <option value="18pt">18pt</option>
          <option value="20pt">20pt</option>
          <option value="24pt">24pt</option>
          <option value="28pt">28pt</option>
          <option value="32pt">32pt</option>
          <option value="36pt">36pt</option>
        </select>
      </div>

      <div class="tb-group">
        <button onmousedown="event.preventDefault(); execCmd('formatBlock', 'h1');" title="Grand Titre">H1</button>
        <button onmousedown="event.preventDefault(); execCmd('formatBlock', 'h2');" title="Sous-titre">H2</button>
        <button onmousedown="event.preventDefault(); addLink();" title="Insérer un lien">🔗</button>
        <button onmousedown="event.preventDefault(); execCmd('undo');" title="Annuler">↩️</button>
        <button onmousedown="event.preventDefault(); execCmd('redo');" title="Rétablir">↪️</button>
      </div>

      <div class="tb-group">
        <div class="color-picker-wrapper" title="Couleur du texte">
          🎨 Texte <input type="color" id="textColorPicker" onchange="execCmd('foreColor', this.value)">
        </div>
        <div class="color-picker-wrapper" title="Surligner le texte">
          🟡 Fond <input type="color" id="bgColorPicker" value="#ffff00" onchange="execCmd('hiliteColor', this.value)">
        </div>
        <button onmousedown="event.preventDefault(); execCmd('removeFormat');" title="Effacer tout le formatage">🧹</button>
      </div>
    </div>
  </div>

  <div id="modalContent" contenteditable="true" placeholder="Tape ta note ici..."></div>
</div>

<div id="main">
  <div id="editor-header">
    <input id="node-title" placeholder="Titre">
    <button id="toggleLinesBtn" title="Afficher/Masquer les numéros de ligne">123</button>
    <button id="openEditBtn" onclick="openEditModal()" title="Ouvrir la fenêtre de rédaction">✏️ Écrire</button>
  </div>

  <div class="editor-container">
    <div id="lineNumbers"></div>
    <div id="content" contenteditable="true" placeholder="Tape ou modifie ta note ici..." oninput="saveMainContent()"></div>
  </div>
</div>

<script>
const customPngIcons = {
  url1: "https://icons.iconarchive.com/icons/fatcow/farm-fresh/32/file-extension-html-icon.png",

  url6: "https://icons.iconarchive.com/icons/fatcow/farm-fresh/32/page-white-excel-icon.png", 
  url7: "https://icons.iconarchive.com/icons/fatcow/farm-fresh/32/page-white-word-icon.png",

  url9: "https://icons.iconarchive.com/icons/hopstarter/office-2010/32/Microsoft-Office-Excel-icon.png", 
  url10: "https://icons.iconarchive.com/icons/hopstarter/office-2010/32/Microsoft-Office-One-Note-icon.png", 
  url11: "https://icons.iconarchive.com/icons/hopstarter/office-2010/32/Microsoft-Office-Publisher-icon.png", 
  url12: "https://icons.iconarchive.com/icons/hopstarter/office-2010/32/Microsoft-Office-Word-icon.png", 
  url13: "https://icons.iconarchive.com/icons/treetog/file-type/32/accdb-icon.png", 
  url14: "https://icons.iconarchive.com/icons/treetog/file-type/32/docx-win-icon.png", 
  url15: "https://icons.iconarchive.com/icons/treetog/file-type/32/pub-icon.png", 
  url16: "https://icons.iconarchive.com/icons/treetog/file-type/32/xlsx-win-icon.png", 
  url17: "https://icons.iconarchive.com/icons/icondrawer/black-and-blue-add-on/32/GarageBand-icon.png", 
  url18: "https://icons.iconarchive.com/icons/filetypeicons/filetype/32/html-icon.png", 
  url19: "https://icons.iconarchive.com/icons/dtafalonso/ios7-desktop/32/Notes-icon.png",

function setTheme(mode) {
  const root = document.documentElement;
  document.getElementById('lightThemeBtn').classList.remove('active');
  document.getElementById('darkThemeBtn').classList.remove('active');

  if(mode === 'light') {
    root.style.setProperty('--bg', '#f5f7fa');
    root.style.setProperty('--bg2', '#e9eef5');
    root.style.setProperty('--text', '#222222');
    root.style.setProperty('--border', '#c8d3e0');
    root.style.setProperty('--linenum-bg', '#e1e6ed');
    root.style.setProperty('--linenum-color', '#8892a0');
    document.getElementById('lightThemeBtn').classList.add('active');
  } else {
    root.style.setProperty('--bg', '#1e1e1e');
    root.style.setProperty('--bg2', '#252526');
    root.style.setProperty('--text', '#ffffff');
    root.style.setProperty('--border', '#333333');
    root.style.setProperty('--linenum-bg', '#2d2d2d');
    root.style.setProperty('--linenum-color', '#858585');
    document.getElementById('darkThemeBtn').classList.add('active');
  }
  localStorage.setItem('notes_theme', mode);
}

function initTheme() {
  const savedTheme = localStorage.getItem('notes_theme') || 'dark';
  setTheme(savedTheme);
}

function openEditModal() {
  let i = items.find(x => x.id === currentId);
  if(!i) return;
  editModalTitle.textContent = "Édition : " + (i.title || "Nouvelle note");
  modalContent.innerHTML = i.content || "";
  modalEdit.style.display = "flex";
  setTimeout(() => modalContent.focus(), 100);
}

function closeEditModal() {
  let i = items.find(x => x.id === currentId);
  if(i){
    i.content = modalContent.innerHTML;
    contentInput.innerHTML = i.content;
    save();
    updateLineNumbers();
  }
  modalEdit.style.display = "none";
}

function saveMainContent() {
  let i = items.find(x => x.id === currentId);
  if (i) {
    i.content = contentInput.innerHTML;
    save();
    updateLineNumbers();
  }
}

function updateToolbarState() {
  const btnBold = document.getElementById("btn-bold");
  const btnItalic = document.getElementById("btn-italic");
  const btnUnderline = document.getElementById("btn-underline");
  const btnStrike = document.getElementById("btn-strike");

  if (btnBold) btnBold.classList.toggle("active", document.queryCommandState("bold"));
  if (btnItalic) btnItalic.classList.toggle("active", document.queryCommandState("italic"));
  if (btnUnderline) btnUnderline.classList.toggle("active", document.queryCommandState("underline"));
  if (btnStrike) btnStrike.classList.toggle("active", document.queryCommandState("strikeThrough"));
}

function execCmd(command, value = null) {
  document.execCommand(command, false, value);
  modalContent.focus();
  updateToolbarState();
}

document.addEventListener("selectionchange", () => {
  if (document.activeElement === modalContent) {
    updateToolbarState();
  }
});

modalContent.addEventListener("keyup", updateToolbarState);
modalContent.addEventListener("mouseup", updateToolbarState);

function changeTextSize(sizePt) {
  let sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;

  let range = sel.getRangeAt(0);

  let parentSpan = range.commonAncestorContainer;
  if (parentSpan.nodeType === 3) parentSpan = parentSpan.parentNode;

  if (parentSpan && parentSpan.tagName === "SPAN" && parentSpan.style.fontSize) {
    parentSpan.style.fontSize = sizePt;
    parentSpan.style.lineHeight = "normal";
  } else {
    let span = document.createElement("span");
    span.style.fontSize = sizePt;
    span.style.lineHeight = "normal";

    try {
      span.appendChild(range.extractContents());
      range.insertNode(span);
      
      sel.removeAllRanges();
      let newRange = document.createRange();
      newRange.selectNodeContents(span);
      sel.addRange(newRange);
    } catch (e) {
      document.execCommand("fontSize", false, "3");
    }
  }

  modalContent.focus();
}

function updateLineNumbers(){
  if(!showLines) return;
  const lines = (contentInput.innerText || contentInput.textContent).split("\n").length;
  let html = "";
  for(let i = 1; i <= lines; i++) { html += i + "<br>"; }
  lineNumbers.innerHTML = html;
}

toggleLinesBtn.onclick = () => {
  showLines = !showLines;
  if(showLines){
    lineNumbers.style.display = "block";
    toggleLinesBtn.classList.add("active");
    updateLineNumbers();
  } else {
    lineNumbers.style.display = "none";
    toggleLinesBtn.classList.remove("active");
  }
};

function load(){
  initTheme();
  items = JSON.parse(localStorage.getItem(KEY) || "[]");
  if(!items.length){ items.push({id:Date.now(), type:"folder", title:"Principal", parent:null, content:"", open:true, color:"#fff", bg:"#252526", icon:"emoji:📁", font:"-apple-system", size:"14px", bold:false, italic:false, underline:false}); save(); }
  if(!currentId) currentId = items[0].id;
  render(); loadCurrent();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }

document.getElementById("exportBtn").onclick = () => {
  let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
  let dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", "mes_notes_arbre.json");
  document.body.appendChild(dlAnchorElem);
  dlAnchorElem.click();
  dlAnchorElem.remove();
};

document.getElementById("importBtn").onclick = () => { document.getElementById("importFile").click(); };
document.getElementById("importFile").onchange = (e) => {
  let file = e.target.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(event) {
    try {
      items = JSON.parse(event.target.result);
      save();
      currentId = items[0]?.id || null;
      render();
      loadCurrent();
      alert("Arbre de notes restauré avec succès !");
    } catch(err) {
      alert("Erreur lors de la lecture du fichier.");
    }
  };
  reader.readAsText(file);
};

function iconHTML(i){
  if(!i.icon || i.icon === "none") return "";
  if(i.icon?.startsWith("png:")) {
    let url = customPngIcons[i.icon.split(":")[1]] || i.icon.replace("png:", "");
    return '<img src="'+url+'" class="tree-icon-png">';
  }
  if(i.icon?.startsWith("yellow:")) return '<span class="icon-yellow">'+i.icon.split(":")[1]+'</span>';
  if(i.icon?.startsWith("emoji:")) return i.icon.split(":")[1];
  return i.type === "note" ? "📝" : "📁";
}

function setupIconPicker(targetType, listElemId) {
  const scrollList = document.getElementById(listElemId);
  scrollList.innerHTML = "";

  iconOptionsList.forEach(opt => {
    let div = document.createElement("div");
    div.className = "icon-option";
    let formattedVal = "";

    if(opt.type === "none") {
      div.innerText = opt.label;
      formattedVal = "none";
    } else if(opt.type === "emoji") {
      div.innerText = opt.value;
      formattedVal = "emoji:" + opt.value;
    } else if(opt.type === "png") {
      div.innerHTML = `<img src="${opt.url}" />`;
      formattedVal = "png:" + opt.key;
    }

    if(tempSelectedIcons[targetType] === formattedVal) div.classList.add("selected");

    div.onclick = () => {
      scrollList.querySelectorAll(".icon-option").forEach(el => el.classList.remove("selected"));
      div.classList.add("selected");
      tempSelectedIcons[targetType] = formattedVal;
    };

    scrollList.appendChild(div);
  });
}

function render(){
  tree.innerHTML = "";
  (function lvl(pid, indent){
    items.filter(i => i.parent === pid).forEach(item => {
      let li = document.createElement("li");
      li.className = item.id === currentId ? "active" : "";
      li.style.paddingLeft = indent + "px";
      
      if(item.id !== currentId){
        if(item.color) li.style.color = item.color;
        if(item.bg) li.style.background = item.bg;
      }
      
      if(item.font) li.style.fontFamily = item.font;
      if(item.size) li.style.fontSize = item.size;
      if(item.bold) li.style.fontWeight = "bold";
      if(item.italic) li.style.fontStyle = "italic";
      if(item.underline) li.style.textDecoration = "underline";

      let hasChildren = items.some(i => i.parent === item.id);
      let arrow = (item.type !== "note" || hasChildren) ? (item.open ? "▼" : "▶") : "";

      li.innerHTML = '<span class="arrow">'+arrow+'</span><span>'+iconHTML(item)+'</span><span class="item-title">'+item.title+'</span><span class="item-menu-icon" title="Menu">⋮</span>';

      li.querySelector(".arrow")?.addEventListener("click", e => { e.stopPropagation(); item.open = !item.open; save(); render(); });
      
      li.querySelector(".item-menu-icon").onclick = e => {
        e.stopPropagation();
        menuTarget = item;
        let rect = e.target.getBoundingClientRect();
        contextMenu.style.top = rect.bottom + "px";
        contextMenu.style.left = rect.left + "px";
        contextMenu.style.display = "block";
      };

      li.addEventListener("pointerdown", e => {
        if (e.target.closest(".item-menu-icon") || e.target.closest(".arrow")) return;

        e.preventDefault(); 
        currentId = item.id; 
        loadCurrent(); 
        render(); 
      });
      
      tree.appendChild(li);
      if(item.open) lvl(item.id, indent + 20);
    });
  })(null, 0);
}

window.onclick = () => contextMenu.style.display = "none";

function loadCurrent(){ 
  let i = items.find(x => x.id === currentId); 
  if(i){ 
    titleInput.value = i.title; 
    contentInput.innerHTML = i.content || ""; 
    updateLineNumbers();
  } 
}

delOk.onclick = () => {

};

function openOptionsFor(item){
  if(item.type === "folder"){
    folderName.value = item.title; folderBgColor.value = item.bg||"#252526"; folderTextColor.value = item.color||"#fff";
    tempSelectedIcons.folder = item.icon || "emoji:📁";
    setupIconPicker('folder', 'folderIconList');
    folderFont.value = item.font||"-apple-system"; folderSize.value = item.size||"14px";
    folderBold.checked = !!item.bold; folderItalic.checked = !!item.italic; folderUnderline.checked = !!item.underline;
    modal.style.display = "flex";
  }
  else if(item.type === "subfolder"){
    subName.value = item.title; subBgColor.value = item.bg||"#252526"; subTextColor.value = item.color||"#fff";
    tempSelectedIcons.sub = item.icon || "emoji:📂";
    setupIconPicker('sub', 'subIconList');
    subFont.value = item.font||"-apple-system"; subSize.value = item.size||"14px";
    subBold.checked = !!item.bold; subItalic.checked = !!item.italic; subUnderline.checked = !!item.underline;
    modalSub.style.display = "flex";
  }
  else if(item.type === "note"){
    noteName.value = item.title; noteBgColor.value = item.bg||"#252526"; noteTextColor.value = item.color||"#fff";
    tempSelectedIcons.note = item.icon || "emoji:📝";
    setupIconPicker('note', 'noteIconList');
    noteFont.value = item.font||"-apple-system"; noteSize.value = item.size||"14px";
    noteBold.checked = !!item.bold; noteItalic.checked = !!item.italic; noteUnderline.checked = !!item.underline;
    modalNote.style.display = "flex";
  }
}

addFolder.onclick = () => { 
  folderName.value=""; menuTarget=null; folderFont.value="-apple-system"; folderSize.value="14px"; 
  folderBold.checked=false; folderItalic.checked=false; folderUnderline.checked=false; 
  tempSelectedIcons.folder = "emoji:📁";
  setupIconPicker('folder', 'folderIconList');
  modal.style.display="flex"; 
};
cancelModal.onclick = () => modal.style.display="none";
createFolder.onclick = () => {
  let d = {title:folderName.value||"Dossier", bg:folderBgColor.value, color:folderTextColor.value, icon:tempSelectedIcons.folder, font:folderFont.value, size:folderSize.value, bold:folderBold.checked, italic:folderItalic.checked, underline:folderUnderline.checked};
  if(menuTarget && menuTarget.type==="folder") { Object.assign(menuTarget, d); }
  else { items.push(Object.assign({id:Date.now(), type:"folder", parent:null, content:"", open:true}, d)); }
  save(); render(); modal.style.display="none";
};

addSubFolder.onclick = () => { 
  let p = items.find(i=>i.id===currentId); 
  if(!p||p.type==="note") return alert("Sélectionne un dossier"); 
  subName.value=""; menuTarget=null; subFont.value="-apple-system"; subSize.value="14px"; 
  subBold.checked=false; subItalic.checked=false; subUnderline.checked=false; 
  tempSelectedIcons.sub = "emoji:📂";
  setupIconPicker('sub', 'subIconList');
  modalSub.style.display="flex"; 
};
cancelModalSub.onclick = () => modalSub.style.display="none";
createSub.onclick = () => {
  let p = items.find(i=>i.id===currentId);
  let d = {title:subName.value||"Sous-dossier", bg:subBgColor.value, color:subTextColor.value, icon:tempSelectedIcons.sub, font:subFont.value, size:subSize.value, bold:subBold.checked, italic:subItalic.checked, underline:subUnderline.checked};
  if(menuTarget && menuTarget.type==="subfolder") { Object.assign(menuTarget, d); }
  else { items.push(Object.assign({id:Date.now(), type:"subfolder", parent:p.id, content:"", open:true}, d)); p.open=true; }
  save(); render(); modalSub.style.display="none";
};

addNote.onclick = () => { 
  let p = items.find(i=>i.id===currentId); 
  if(!p) return alert("Sélectionne un dossier, sous-dossier ou une note"); 
  items.push({id:Date.now(), type:"note", title:"Nouvelle note", parent:p.id, content:"", icon:"emoji:📝", font:"-apple-system", size:"14px", bold:false, italic:false, underline:false}); 
  p.open=true; 
  save(); 
  render(); 
};
cancelModalNote.onclick = () => modalNote.style.display="none";
saveNoteOpt.onclick = () => {
  if(menuTarget && menuTarget.type==="note"){ 
    Object.assign(menuTarget, {title:noteName.value||"Note", bg:noteBgColor.value, color:noteTextColor.value, icon:tempSelectedIcons.note, font:noteFont.value, size:noteSize.value, bold:noteBold.checked, italic:noteItalic.checked, underline:noteUnderline.checked}); 
    save(); render(); loadCurrent(); 
  }
  modalNote.style.display="none";
};

load();
